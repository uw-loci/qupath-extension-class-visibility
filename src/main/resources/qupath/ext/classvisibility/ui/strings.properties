# --- Help -------------------------------------------------------------------------------------
help.title=Class visibility
help.body=This panel writes to the same show/hide setting as QuPath's own Classes pane.\n\n\
Classes list: check a class to make it a rule.\n\
Components list: check one name part to match every class containing it.\n\
Visibility rule: whether checked classes are the ones hidden, or the only ones shown.\n\n\
"List" chooses which objects are counted and listed. It never limits what is hidden -- a hidden \
class is hidden for cells, detections and annotations alike.\n\n\
If the viewer goes blank, use "Reset all" in this panel, or "Restore class visibility to default \
settings" in QuPath's Classes pane, under the More button beside the show/hide dropdown.
