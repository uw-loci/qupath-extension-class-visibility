# Class Visibility -- display strings.
#
# Every string here is user-facing JavaFX display text. Section 13 of the Phase 1 UI/UX design
# fixes this wording; change it there first. ASCII only: every "--" is two ASCII hyphens, and
# there are no arrows, Unicode comparators or emoji anywhere in this file.
#
# Singular and plural are separate complete format strings. Names substitute into a complete
# sentence via %s; nothing is built by concatenating onto a fragment.

name=Class Visibility
description=Show or hide objects by class, using the classes present in the current image.

