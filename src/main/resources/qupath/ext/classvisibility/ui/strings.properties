# --- Help -------------------------------------------------------------------------------------
help.title=Class visibility
help.body=Opening this panel hides every object: the rule starts on "Show only checked \
classes" with nothing checked. Check the classes you want to see. Close the panel without \
checking anything and everything comes back.\n\n\
This panel writes to the same show/hide setting as QuPath's own class list, in the \
Annotations tab.\n\n\
Classes list: check a class to make it a rule. With "Exact matches only" off, a class rule also \
matches any class containing all of its parts.\n\
Components list: check one name part to match every class containing it.\n\
Visibility rule: whether checked classes are the ones hidden, or the only ones shown.\n\n\
"List" chooses which objects are counted and listed. It never limits what is hidden -- a hidden \
class is hidden for cells, detections and annotations alike.\n\n\
If the viewer goes blank, use "Reset all" in this panel, or "Restore class visibility to default \
settings" in QuPath's own class list (the Annotations tab), under the More button beside the \
show/hide dropdown.\n\n\
If that does not bring the objects back, the cause may not be a class rule at all. Right-click \
the toolbar button and choose "Restore the state from when the panel opened", which also puts \
back overlay opacity and the object types QuPath is showing.\n\n\
"Preset" saves the view you have now into the project under a name, and brings it back later. \
Presets are yours to make; the restore above is recorded automatically whether or not you \
thought to.
