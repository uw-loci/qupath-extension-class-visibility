# --- Status strip -----------------------------------------------------------------------------
status.s1=[OK] No rules active -- every object is visible.
status.s2=[!] Every object is hidden. "Show only checked classes" is on and nothing is checked.
status.s3.one=[i] 1 rule active -- objects in that class are hidden.
status.s3.many=[i] %d rules active -- objects in those classes are hidden.
status.s4.one=[i] 1 rule active -- only objects matching it are shown.
status.s4.many=[i] %d rules active -- only objects matching them are shown.
status.s5=[i] Showing only %s. Everything else is hidden.
status.s6=Counting classes in %s...
status.s7.one=1 rule has no class in this image.
status.s7.many=%d rules have no class in this image.
status.s8.one=[i] 1 rule active -- it applies to every image.
status.s8.many=[i] %d rules active -- they apply to every image.
status.s9="%s" is in %d of %d classes and %d of %d objects.
status.exactWarning=[!] "Exact matches only" is on. Component rules match only a class with \
exactly that name, so they will not find derived classes.

